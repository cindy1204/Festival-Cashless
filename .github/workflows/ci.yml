name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # No service, no database, no name to resolve. The http suite listens on an
    # ephemeral port on the loopback and talks to it over a real socket, so the
    # requests really are asynchronous and really do interleave, but nothing
    # here depends on a machine being up: a green run says something about the
    # code and not about the day.
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Codegen only. The client is not committed, and generating it does not
      # talk to a database, so the type check has something to read.
      - name: Generate the prisma client
        run: npx prisma generate

      # The same single command a developer runs before pushing.
      - name: Verify
        run: npm run verify
