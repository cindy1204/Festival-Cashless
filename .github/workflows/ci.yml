name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Nothing here listens on a port, resolves a name or reaches a database.
    # The application is driven in process against a fake repository, so a
    # green run says something about the code and not about the day.
    env:
      CI: "true"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Codegen only. The client is not committed, and generating it does not
      # talk to a database, so the type check has something to read.
      - name: Generate the prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Http tests
        run: npm run test:api
